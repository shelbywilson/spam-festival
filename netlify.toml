# Netlify configuration for spamnewmedia
#
# Site layout: each festival year owns a directory at the site root.
#
#   /2025/          2025 landing page      (2025/index.html)
#   /2025/lineup    2025 lineup + map      (2025/lineup.html)
#   /2026/          2026 landing page      (2026/index.html)
#
# Each year directory is fully self-contained: its own main.css, fonts/,
# logos/, ascii-play/ and assets/. Nothing is shared between years, so editing
# 2026 can never alter or break an archived festival. favicon.ico is the sole
# exception, at the root because browsers request /favicon.ico there directly.
#
# ---------------------------------------------------------------------------
# EACH YEAR: copy the previous year's directory, then repoint the root redirect
# below at it. Leave the older years' redirects in place — they keep old links
# working.
# ---------------------------------------------------------------------------

# Root serves the current festival. Temporary (302) so browsers don't cache it
# past the point where it should point at the next year.
[[redirects]]
  from = "/"
  to = "/2026/"
  status = 302
  force = true

[[redirects]]
  from = "/index.html"
  to = "/2026/"
  status = 302
  force = true

# --- 2025 legacy URLs -------------------------------------------------------
# Before the restructure the site root WAS the 2025 festival, so these are the
# URLs that were shared publicly during and after SPAM 2025.

# /2025.html was the lineup + map page.
[[redirects]]
  from = "/2025.html"
  to = "/2025/lineup"
  status = 301

# Year-scoped stylesheets moved into the year directory.
[[redirects]]
  from = "/2025.css"
  to = "/2025/2025.css"
  status = 301

[[redirects]]
  from = "/2025-map.css"
  to = "/2025/2025-map.css"
  status = 301

# 2025 images moved from /assets/2025/* to /2025/assets/*. Keeps hotlinked and
# social-card image URLs (og:image, Instagram, press) resolving.
[[redirects]]
  from = "/assets/2025/*"
  to = "/2025/assets/:splat"
  status = 301

[[redirects]]
  from = "/assets/floor-1.png"
  to = "/2025/assets/floor-1.png"
  status = 301

[[redirects]]
  from = "/assets/floor-2.png"
  to = "/2025/assets/floor-2.png"
  status = 301

# The footer video, which was at the root back when 2025 was the whole site.
[[redirects]]
  from = "/assets/SPAM_01_1.webm"
  to = "/2025/assets/SPAM_01_1.webm"
  status = 301

[[redirects]]
  from = "/assets/SPAM_01_1.mp4"
  to = "/2025/assets/SPAM_01_1.mp4"
  status = 301

# The 2025 poster — this was the og:image for every page on the old site, so
# it is the single most-cached asset URL.
[[redirects]]
  from = "/assets/SPAM_Digital Poster_IG In-Feed_1080x1350.jpg"
  to = "/2025/assets/SPAM_Digital Poster_IG In-Feed_1080x1350.jpg"
  status = 301

# Stylesheet, fonts, logos and the hero animation also used to sit at the root.
# Any still-cached page referencing them is a 2025 page, so they resolve there.
[[redirects]]
  from = "/main.css"
  to = "/2025/main.css"
  status = 301

[[redirects]]
  from = "/fonts/*"
  to = "/2025/fonts/:splat"
  status = 301

[[redirects]]
  from = "/logos/*"
  to = "/2025/logos/:splat"
  status = 301

[[redirects]]
  from = "/ascii-play/*"
  to = "/2025/ascii-play/:splat"
  status = 301

# --- 2026 -------------------------------------------------------------------
# The 2026 pages previously lived on Cargo at 6377761.cargo.site under these
# slugs, so links shared before the move keep working.
[[redirects]]
  from = "/2026/friday-performers"
  to = "/2026/friday"
  status = 301

[[redirects]]
  from = "/2026/saturday-performances"
  to = "/2026/saturday"
  status = 301

[[redirects]]
  from = "/2026/homepage-panel"
  to = "/2026/"
  status = 301

# --- 2024 -------------------------------------------------------------------
# There is no 2024 page in this repo, but its photos are kept and follow the
# same per-year layout.
[[redirects]]
  from = "/assets/2024/*"
  to = "/2024/assets/:splat"
  status = 301
