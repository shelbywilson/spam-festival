# Root serves the current festival. Temporary (302) so browsers don't cache it
# past the point where it should point at the next year. Update yearly.

[[redirects]]
  from = "/"
  to = "/2026/"
  status = 302
  force = true

[[redirects]]
  from = "/index.html"
  to = "/2026/"
  status = 302
  force = true
